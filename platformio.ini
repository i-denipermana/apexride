; ApexRide V1 — ESP32-S3 N16R8 DevKitC-1
;
; The sketch also builds in the Arduino IDE: open ApexRide/ApexRide.ino
; and select "ESP32S3 Dev Module" with 16 MB flash, OPI PSRAM, and a custom
; partition scheme matching partitions/apexride_16mb.csv.
;
; Host tests do not use PlatformIO:  make -C tests test

[platformio]
src_dir = ApexRide

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16 MB quad-SPI flash with 8 MB octal-SPI PSRAM.
board_build.flash_mode      = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size     = 16MB
board_upload.maximum_size   = 3145728
board_build.partitions      = partitions/apexride_16mb.csv
board_build.filesystem      = littlefs

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra
    -Wno-unused-parameter
